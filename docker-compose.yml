services:
  client:
    build: ./packages/client
    ports:
      - "5173:5173"
    env_file:
      - ./packages/client/.env
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    command: ["sh", "-c", "bunx --bun prisma migrate deploy --config prisma7.config.ts && exec bun run start"]
    ports:
      - "5000:5000"
    env_file:
      - ./packages/server/.env
    environment:
      NODE_ENV: development
      PORT: "5000"
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/timeflow
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/timeflow
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: timeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timeflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
